spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Disable Postgres-specific HikariCP SSL settings for H2
spring.datasource.hikari.data-source-properties.ssl=false
spring.datasource.hikari.data-source-properties.sslmode=disable
spring.datasource.hikari.data-source-properties.sslrootcert=

# Disable OAuth2 auto-config for tests
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

# JWT secret for tests — must be exactly 64 ASCII chars (512 bits) for HS512
jwt.secret=inkslot-test-jwt-secret-key-for-unit-tests-only-do-not-use-prod1
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# Disable email sending in tests
spring.mail.host=localhost
spring.mail.port=3025
